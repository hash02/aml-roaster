name: 📇 Refresh Address Feeds

# Weekly refresh of the vendored OFAC address feed. The refresh itself is
# plain Python stdlib; delivery is a pull request opened by
# peter-evans/create-pull-request. That step requires the repository
# setting "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions > General > Workflow permissions) to be enabled;
# without it the PR step fails even though the refresh succeeds.
# Repo default token permissions stay "read": the write scopes this job
# needs are declared in the permissions block below, nothing more.

on:
  schedule:
    # Weekly on Sunday 03:00 UTC — upstream OFAC feed is updated as the
    # SDN list changes, and Python stdlib is the only runtime requirement.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One run at a time; a manual dispatch queues behind a scheduled run
# instead of racing it onto the same delivery branch.
concurrency:
  group: refresh-addresses
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 🔄 Refresh OFAC feed
        run: python scripts/refresh_addresses.py

      - name: 📬 Open PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/refresh-addresses
          title: 'chore: refresh vendored address feeds'
          commit-message: 'chore: refresh vendored address feeds'
          body: |
            Automated weekly sync of `addresses/ofac.json` from
            [ultrasoundmoney/ofac-ethereum-addresses](https://github.com/ultrasoundmoney/ofac-ethereum-addresses) (MIT).

            If only the metadata / sort order changed, close this PR.
          add-paths: addresses/
          delete-branch: true
