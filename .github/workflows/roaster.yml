name: 🔥 AML Roaster — Scheduled Scan

on:
  schedule:
    # Run every 6 hours (GitHub Actions uses UTC). A full run takes
    # 18 to 30 minutes, so a 30-minute schedule could never hold.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Manual trigger for testing

permissions:
  contents: write

jobs:
  roast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: aml-roaster-scheduled-scan
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🔥 Run AML Roaster
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python roaster.py

      - name: 📊 Check for new reports
        id: check
        run: |
          if [[ -n $(git status reports/ --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Commit and push reports
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "AML Roaster Bot"
          git config user.email "roaster@hash02.dev"
          git add reports/
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "🔥 Roaster report — ${TIMESTAMP}"
          # Other workflows (feed sync) and manual pushes can land on main
          # while a scan runs. Rebase onto the latest main before pushing,
          # with retries, so a finished scan is never lost to a push race.
          # Generated files under reports/ are rewritten wholesale by every
          # run, so a rebase conflict there is resolved in favour of this
          # (newest) run; a conflict anywhere else aborts the step.
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              if git diff --name-only --diff-filter=U | grep -qv '^reports/'; then
                git rebase --abort
                exit 1
              fi
              git checkout --theirs reports/
              git add reports/
              GIT_EDITOR=true git rebase --continue
            fi
            if git push; then pushed=true; break; fi
            sleep 5
          done
          if [ "$pushed" != "true" ]; then exit 1; fi
